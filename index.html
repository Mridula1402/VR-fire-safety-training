<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CalmDrill – VR Fire Safety Training</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--ink:#eef2f3;--bg:#10181c;--panel:rgba(16,24,28,.86);--line:#2f444c;--amber:#ffb23e;--green:#3ddc84;--red:#ff5d4d}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
canvas{display:block;touch-action:none}
.p{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.4}
#obj{top:12px;left:12px;max-width:300px}#obj b{display:block;margin-bottom:6px}#obj div{margin:3px 0}.ok{color:var(--green)}.no{color:var(--red)}
#st{top:12px;right:12px;width:210px}#bar{height:10px;border-radius:5px;background:#27383f;margin-top:6px;overflow:hidden}#fill{height:100%;width:0;background:var(--green);transition:width .3s,background .3s}
#st small{color:#a9bcc3}
#btns{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:none;border:0;padding:0;width:calc(100% - 24px)}
button{font:inherit;color:var(--ink);background:#1d2d34;border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button:hover{background:#26404a}button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.on,button.go{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700}
#toast{top:84px;left:50%;transform:translateX(-50%);max-width:min(560px,90vw);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at center,transparent 38%,#000 78%)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .14s}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,14,.9);padding:16px;overflow:auto}
#ov .box{max-width:620px;width:100%}h1{font-size:30px;margin:0 0 6px}h2{margin:16px 0 6px;font-size:17px}p{margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}
#br{width:90px;height:90px;border-radius:50%;margin:20px auto;background:radial-gradient(#7fe6ff,#2a7d96);animation:b 10s ease-in-out infinite}
@keyframes b{0%{transform:scale(1)}40%{transform:scale(1.9)}55%{transform:scale(1.9)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#br{animation-duration:20s}}
@media(max-width:600px){#obj{max-width:200px;font-size:13px}#st{width:140px;font-size:13px}}
</style>
</head>
<body>
<div id="vig"></div><div id="fade"></div>
<div id="obj" class="p hide"></div>
<div id="st" class="p hide">Stress level<div id="bar"><div id="fill"></div></div><small>Simulated from distance, smoke and noise. Not a body sensor.</small></div>
<div id="toast" class="p"></div>
<div id="btns" class="p hide">
 <button id="bCrouch">Crouch (C)</button><button id="bL">Turn left (Q)</button><button id="bR">Turn right (E)</button>
 <button id="bBreak">I need a break</button><button id="bPause">Pause (Space)</button><button id="bVR" class="hide">Enter VR</button>
</div>
<div id="ov"><div class="box p" id="ovbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),cl=THREE.MathUtils.clamp;
const LV=[{n:'Gentle',fire:.6,alarm:.03,smoke:.02},{n:'Standard',fire:1,alarm:.08,smoke:.05},{n:'Realistic',fire:1.4,alarm:.15,smoke:.09}];
const S={move:'teleport',lvl:0,voice:true,state:'menu'};
let ac,osc,gain,alarmTimer,toastT;
/* ---------- scene ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b2228);scene.fog=new THREE.FogExp2(0x1b2228,.02);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);cam.rotation.order='YXZ';
const rig=new THREE.Group();rig.add(cam);scene.add(rig);cam.position.y=1.6;
scene.add(new THREE.HemisphereLight(0xffffff,0x445066,.9));
const mat=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,basic){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),basic?new THREE.MeshBasicMaterial({color:c}):mat(c));m.position.set(x,y,z);scene.add(m);return m}
function label(t,c,x,y,z,ry=0){const k=document.createElement('canvas');k.width=256;k.height=64;const g=k.getContext('2d');g.fillStyle=c;g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText(t,128,44);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(k)}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m)}
const floor=box(24,.1,24,0x8a919b,0,-.05,0),yard=box(24,.1,10,0x3f7d4a,0,-.05,-17);
box(24,.1,24,0xdde1e6,0,3.05,0);
box(24,3,.2,0xcfd4db,0,1.5,12);box(.2,3,24,0xcfd4db,12,1.5,0);box(.2,3,24,0xcfd4db,-12,1.5,0);
box(18.5,3,.2,0xcfd4db,-2.75,1.5,-12);box(2.5,3,.2,0xcfd4db,10.75,1.5,-12);box(3,.7,.2,0xcfd4db,8,2.65,-12);
label('EXIT','#1a9c4a',8,2.3,-11.85);
box(.1,2.2,1.6,0x6b4a2f,-11.85,1.1,-4);label('EXIT','#1a9c4a',-11.8,2.5,-4,Math.PI/2);
const pull=box(.12,.3,.22,0xe02424,11.85,1.3,6,true);pull.userData.t='alarm';label('FIRE ALARM','#b21c1c',11.8,1.75,6,-Math.PI/2);
const lift=box(.1,2.2,1.8,0x8a909a,-11.85,1.1,8);lift.userData.t='lift';label('LIFT','#4a5560',-11.8,2.5,8,Math.PI/2);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.4,2.1,40),new THREE.MeshBasicMaterial({color:0x3ddc84,side:2}));ring.rotation.x=-Math.PI/2;ring.position.set(8,.03,-16);scene.add(ring);label('ASSEMBLY POINT','#1a9c4a',8,1.6,-18.4);
[[-6,9],[6,9],[-6,3],[6,3],[6,-3],[-8,-8],[3,-8]].forEach(p=>{box(2,.75,.9,0x7a5c3e,p[0],.375,p[1]);box(.5,.4,.4,0x2d3a46,p[0],.95,p[1])});
box(2,.5,.9,0x2a1a10,-8,.25,-4);
const targets=[floor,yard,pull,lift];
/* fire + smoke */
function tex(st){const k=document.createElement('canvas');k.width=k.height=64;const g=k.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);st.forEach(s=>r.addColorStop(s[0],s[1]));g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(k)}
const fT=tex([[0,'rgba(255,240,170,1)'],[.4,'rgba(255,120,20,.7)'],[1,'rgba(255,40,0,0)']]),sT=tex([[0,'rgba(70,70,70,.8)'],[1,'rgba(70,70,70,0)']]);
const FIRE=new THREE.Vector3(-8,0,-4),fl=[],sm=[];
for(let i=0;i<40;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:fT,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));s.userData={p:Math.random(),o:[Math.random()-.5,Math.random()-.5]};scene.add(s);fl.push(s)}
for(let i=0;i<25;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:sT,transparent:true,depthWrite:false}));s.userData={a:Math.random()*6.28,r:Math.random()*5};scene.add(s);sm.push(s)}
const fLight=new THREE.PointLight(0xff6a1a,2,14);fLight.position.set(-8,1.2,-4);scene.add(fLight);
const layer=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshBasicMaterial({color:0x2e2e2e,transparent:true,opacity:.35,side:2}));layer.rotation.x=Math.PI/2;scene.add(layer);
/* ---------- game state ---------- */
let G;
function reset(){G={t:0,stress:0,score:100,exp:0,alarm:false,tA:null,lift:false,calm:0,near:false,door:false,crouch:false,vig:0,exposedEver:false};rig.position.set(0,0,9);rig.rotation.y=0;cam.rotation.x=0;alarmOff()}
reset();
const OBJ=()=>[[G.alarm?1:0,'Raise the alarm: red pull station on the east wall'],[G.lift?-1:(S.state==='end'?1:0),'Avoid the lift'],[G.exposedEver?-1:(S.state==='end'?1:0),'Stay below the smoke: crouch when it descends'],[S.won?1:0,'Leave by the green exit on the north wall and reach the assembly point']];
function drawObj(){$('obj').innerHTML='<b>Your tasks</b>'+OBJ().map(o=>`<div class="${o[0]>0?'ok':o[0]<0?'no':''}">${o[0]>0?'✓':o[0]<0?'✗':'○'} ${o[1]}</div>`).join('')}
function toast(t,quiet){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,4500);
 if(S.voice&&!quiet&&window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.speak(u)}}
/* audio */
function alarmOn(){try{osc=ac.createOscillator();gain=ac.createGain();osc.type='square';osc.frequency.value=880;gain.gain.value=LV[S.lvl].alarm;osc.connect(gain).connect(ac.destination);osc.start();alarmTimer=setInterval(()=>{osc.frequency.value=osc.frequency.value===880?660:880},450)}catch(e){}}
function alarmOff(){try{osc.stop()}catch(e){}clearInterval(alarmTimer);osc=null}
/* ---------- overlays ---------- */
function ov(h){$('ovbox').innerHTML=h;$('ov').classList.remove('hide')}
function hideOv(){$('ov').classList.add('hide')}
function menu(){S.state='menu';$('obj').classList.add('hide');$('st').classList.add('hide');$('btns').classList.add('hide');
 ov(`<h1>CalmDrill</h1><p>A fire drill you can practise without feeling sick or overwhelmed. Learn what to do, in what order, at your own pace.</p>
 <h2>How do you want to move?</h2><div class="chips" data-k="move"><button data-v="teleport" class="on">Teleport: click a spot on the floor (least motion sickness)</button><button data-v="smooth">Smooth walk: W A S D, with a comfort vignette</button></div>
 <h2>How intense should the fire be?</h2><div class="chips" data-k="lvl"><button data-v="0" class="on">Gentle</button><button data-v="1">Standard</button><button data-v="2">Realistic</button></div>
 <h2>Voice guide</h2><div class="chips" data-k="voice"><button data-v="1" class="on">On</button><button data-v="0">Off</button></div>
 <h2>Good to know</h2><p>Drag to look around. Pause any time with Space: nothing is timed while paused. If stress gets too high, the drill stops, guides your breathing, and lowers its own intensity.</p>
 <p><button class="go" id="goBtn">Start the drill</button></p>`);
 document.querySelectorAll('.chips[data-k]').forEach(c=>c.onclick=e=>{const b=e.target.closest('button');if(!b)return;c.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const k=c.dataset.k,v=b.dataset.v;S[k]=k==='move'?v:k==='voice'?v==='1':+v});
 $('goBtn').onclick=start}
function start(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();S.won=false;reset();S.state='run';hideOv();['obj','st','btns'].forEach(i=>$(i).classList.remove('hide'));drawObj();
 $('bL').classList.toggle('hide',false);toast('Fire detected in the west corner. Take a breath. First, find the red alarm on the east wall.')}
function pause(){if(S.state==='run'){S.state='paused';ov(`<h1>Paused</h1><p>The fire is frozen. Take as long as you need.</p><p><button class="go" id="r1">Resume</button> <button id="r2">Breathing break</button> <button id="r3">Back to menu</button></p>`);$('r1').onclick=resume;$('r2').onclick=()=>calm(false);$('r3').onclick=menu}else if(S.state==='paused')resume()}
function resume(){if(S.state==='paused'||S.state==='calm'){S.state='run';hideOv();if(osc)gain.gain.value=LV[S.lvl].alarm}}
function calm(auto){S.state='calm';G.calm++;if(osc)gain.gain.value=0;
 ov(`<h1>${auto?'Let’s slow down':'Breathing break'}</h1><p>Breathe in as the circle grows, out as it shrinks. The fire is paused.</p><div id="br"></div><p><button class="go" id="cc" disabled>Continue</button></p>`);
 setTimeout(()=>{const b=$('cc');if(b){b.disabled=false;b.onclick=()=>{G.stress=30;if(auto&&S.lvl>0){S.lvl--;toast('Intensity lowered to '+LV[S.lvl].n+'. You are doing fine.')}resume()}}},10000)}
function end(win,why){S.state='end';S.won=win;alarmOff();drawObj();const tip=[];
 tip.push(G.alarm?'You raised the alarm at '+Math.round(G.tA)+' s.':'You did not raise the alarm. Alerting others is always step one.');
 tip.push(G.lift?'You went for the lift. Never use lifts in a fire.':'You avoided the lift.');
 tip.push(G.exposedEver?'You spent '+Math.round(G.exp)+' s in smoke. Smoke rises, so crouch low and move.':'You stayed below the smoke.');
 tip.push('Breathing breaks used: '+G.calm+'. Using them is part of good practice.');
 ov(`<h1>${win?'You made it out':'Drill ended'}</h1><p>${why}</p><p><b>Score: ${Math.max(0,Math.round(G.score))} / 100</b></p>${tip.map(t=>'<p>'+t+'</p>').join('')}<p><button class="go" id="again">Try again</button> <button id="back">Change settings</button></p>`);
 $('again').onclick=start;$('back').onclick=menu}
/* ---------- input ---------- */
const keys={};let dn=null;const rc=new THREE.Raycaster(),dom=R.domElement;
function tp(x,z){const p=rig.position;let dx=x-p.x,dz=z-p.z;const d=Math.hypot(dx,dz);if(d>7){dx*=7/d;dz*=7/d}
 const [nx,nz]=clampPos(p.x+dx,p.z+dz,p);$('fade').style.opacity=1;setTimeout(()=>{p.set(nx,0,nz);$('fade').style.opacity=0},140)}
function clampPos(x,z,f){x=cl(x,-11.4,11.4);const gap=x>=6.9&&x<=9.1;
 if(z<-11.7&&f.z>-11.7&&!gap)z=-11.6;if(f.z<=-11.7&&z>-11.7&&!gap)z=-11.8;return[x,cl(z,-18.5,11.4)]}
function hit(l){if(!l.length||S.state!=='run')return;const o=l[0].object,pt=l[0].point;
 if(o.userData.t==='alarm'){if(rig.position.distanceTo(pull.position)>6)return toast('Move closer to the red alarm on the east wall.');
  if(!G.alarm){G.alarm=true;G.tA=G.t;alarmOn();toast('Alarm raised. Now leave by the green exit on the north wall. Stay low if you see smoke.');drawObj()}}
 else if(o.userData.t==='lift'){if(!G.lift){G.lift=true;G.score-=15;drawObj();toast('Never use a lift in a fire. It can stop between floors. Use the exit instead.')}}
 else if(S.move==='teleport'||R.xr.isPresenting)tp(pt.x,pt.z)}
dom.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,m:0}});
dom.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.m+=Math.abs(dx)+Math.abs(dy);dn.x=e.clientX;dn.y=e.clientY;rig.rotation.y-=dx*.004;cam.rotation.x=cl(cam.rotation.x-dy*.004,-1.2,1.2)});
dom.addEventListener('pointerup',e=>{if(dn&&dn.m<6){rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);hit(rc.intersectObjects(targets))}dn=null});
const snap=a=>{if(S.state==='run')rig.rotation.y+=a},crouch=()=>{G.crouch=!G.crouch;$('bCrouch').classList.toggle('on',G.crouch)};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k===' '){e.preventDefault();pause()}if(k==='c'&&S.state==='run')crouch();if(k==='q')snap(.52);if(k==='e')snap(-.52)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
$('bCrouch').onclick=()=>S.state==='run'&&crouch();$('bL').onclick=()=>snap(.52);$('bR').onclick=()=>snap(-.52);$('bPause').onclick=pause;$('bBreak').onclick=()=>S.state==='run'&&calm(false);
/* WebXR */
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok){$('bVR').classList.remove('hide');$('bVR').onclick=()=>navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']}).then(s=>{R.xr.setReferenceSpaceType('local-floor');R.xr.setSession(s)})}}).catch(()=>{});
const ctl=R.xr.getController(0);rig.add(ctl);ctl.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-6)]),new THREE.LineBasicMaterial({color:0xffb23e})));
ctl.addEventListener('selectstart',()=>{const m=new THREE.Matrix4().extractRotation(ctl.matrixWorld);rc.ray.origin.setFromMatrixPosition(ctl.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(m);hit(rc.intersectObjects(targets))});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
/* ---------- loop ---------- */
const hv=new THREE.Vector3();let last=performance.now(),hp=0;
function update(dt){
 const running=S.state==='run',L=LV[S.lvl];if(running)G.t+=dt;hp+=dt;
 const k=L.fire*Math.min(1,.3+G.t/40);
 fl.forEach(s=>{const d=s.userData;d.p=(d.p+dt*.9)%1;s.position.set(FIRE.x+d.o[0]*1.6*k,.3+d.p*2.2*k,FIRE.z+d.o[1]*1.6*k);s.scale.setScalar(((1-d.p)*2+.3)*k);s.material.opacity=1-d.p});
 fLight.intensity=(1.6+Math.sin(hp*18)*.4)*k;
 const sk=Math.min(1,Math.max(0,(G.t-6)/25));
 sm.forEach(s=>{const d=s.userData;s.position.set(FIRE.x+Math.cos(d.a)*d.r*(.4+sk*1.6),2.7,FIRE.z+Math.sin(d.a)*d.r*(.4+sk*1.6));s.scale.setScalar(5);s.material.opacity=.6*sk});
 const ly=Math.max(1.25,3-Math.max(0,G.t-10)*L.smoke);layer.position.y=ly;layer.material.opacity=.35*sk;
 if(!running)return;
 const p=rig.position,yaw=rig.rotation.y;
 if(!R.xr.isPresenting)cam.position.y+=((G.crouch?.95:1.6)-cam.position.y)*Math.min(1,dt*8);
 let moving=0;
 if(S.move==='smooth'){const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  if(f||r){moving=1;const sp=(G.crouch?1:1.6)*dt,[nx,nz]=clampPos(p.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*sp,p.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*sp,p);p.x=nx;p.z=nz}}
 G.vig+=((moving?.85:0)-G.vig)*Math.min(1,dt*5);$('vig').style.opacity=G.vig;
 cam.getWorldPosition(hv);
 const exposed=p.z>-11.7&&hv.y>ly&&sk>0,dF=Math.hypot(p.x-FIRE.x,p.z-FIRE.z);
 if(exposed){G.exp+=dt;G.score-=dt;if(!G.exposedEver){G.exposedEver=true;drawObj();toast('Smoke is above you. Crouch with C and keep moving.')}}
 scene.fog.density+=((exposed?.11:.02)-scene.fog.density)*Math.min(1,dt*2);
 if(dF<2.4&&!G.near){G.near=true;G.score-=10;G.stress+=25;toast('Too close to the fire. Back away and use the other exit.')}if(dF>3.5)G.near=false;
 if(!G.door&&Math.hypot(p.x+11,p.z+4)<2.5){G.door=true;G.score-=5;toast('Heat and smoke block this door. Choose another exit.')}
 const rate=(dF<6?(6-dF)*1.5:0)+(exposed?8:0)+(G.alarm?L.alarm*30:0);
 G.stress=cl(G.stress+(rate-(G.crouch?3:2.5))*dt,0,100);
 $('fill').style.width=G.stress+'%';$('fill').style.background=G.stress>70?'#ff5d4d':G.stress>40?'#ffb23e':'#3ddc84';
 if(G.stress>=85)return calm(true);
 if(G.exp>14)return end(false,'You breathed in too much smoke. In a real fire, staying low can save your life.');
 if(p.z<-14&&Math.abs(p.x-8)<2.5)end(true,'You reached the assembly point. Stay there until the fire service says it is safe.');
}
R.setAnimationLoop(()=>{const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;update(dt);R.render(scene,cam)});
rig.position.set(0,0,9);menu();
</script>
</body>
</html>
